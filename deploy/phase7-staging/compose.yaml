name: split402-phase7-staging

x-workspace-volumes: &workspace-volumes
  - ../..:/workspace
  - split402-phase7-root-node-modules:/workspace/node_modules
  - split402-phase7-agent-sdk-node-modules:/workspace/packages/agent-sdk/node_modules
  - split402-phase7-control-plane-node-modules:/workspace/packages/control-plane/node_modules
  - split402-phase7-express-node-modules:/workspace/packages/express/node_modules
  - split402-phase7-merchant-sdk-node-modules:/workspace/packages/merchant-sdk/node_modules
  - split402-phase7-protocol-node-modules:/workspace/packages/protocol/node_modules
  - split402-phase7-router-node-modules:/workspace/packages/router/node_modules
  - split402-phase7-test-vectors-node-modules:/workspace/packages/test-vectors/node_modules
  - split402-phase7-x402-extension-node-modules:/workspace/packages/x402-extension/node_modules
  - split402-phase7-dashboard-node-modules:/workspace/apps/dashboard/node_modules
  - split402-phase7-demo-agent-node-modules:/workspace/apps/demo-agent/node_modules
  - split402-phase7-demo-merchant-node-modules:/workspace/apps/demo-merchant/node_modules
  - split402-phase7-mcp-demo-node-modules:/workspace/apps/mcp-demo/node_modules
  - split402-phase7-payout-signer-node-modules:/workspace/apps/payout-signer/node_modules

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: split402
      POSTGRES_USER: split402
      POSTGRES_PASSWORD: split402
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split402 -d split402"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${SPLIT402_PHASE7_BIND_ADDRESS:-127.0.0.1}:${SPLIT402_PHASE7_POSTGRES_PORT:-5432}:5432"
    volumes:
      - split402-phase7-postgres:/var/lib/postgresql/data

  control-plane:
    image: node:22-slim
    working_dir: /workspace
    command: >
      sh -lc "corepack enable &&
      corepack pnpm control-plane"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - phase7-staging.env
    environment:
      CI: "true"
      PORT: "4021"
      SPLIT402_DATABASE_URL: postgresql://split402:split402@postgres:5432/split402
      SPLIT402_DATABASE_SSL: "false"
      SPLIT402_CONTROL_PLANE_AUTH_POLICY: required
    ports:
      - "${SPLIT402_PHASE7_BIND_ADDRESS:-127.0.0.1}:${SPLIT402_PHASE7_CONTROL_PLANE_PORT:-4021}:4021"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4021/v1/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    volumes: *workspace-volumes

  migrate:
    image: node:22-slim
    working_dir: /workspace
    command: >
      sh -lc "corepack enable &&
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm control-plane:migrate"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - phase7-staging.env
    environment:
      CI: "true"
      SPLIT402_DATABASE_URL: postgresql://split402:split402@postgres:5432/split402
      SPLIT402_DATABASE_SSL: "false"
    volumes: *workspace-volumes

  dashboard:
    image: node:22-slim
    working_dir: /workspace
    command: >
      sh -lc "corepack enable &&
      corepack pnpm dashboard"
    depends_on:
      control-plane:
        condition: service_healthy
    env_file:
      - phase7-staging.env
    environment:
      CI: "true"
      SPLIT402_DASHBOARD_PORT: "4027"
      SPLIT402_DASHBOARD_CONTROL_PLANE_URL: http://control-plane:4021
      SPLIT402_DASHBOARD_SESSION_COOKIE_SECURE: "false"
    ports:
      - "${SPLIT402_PHASE7_BIND_ADDRESS:-127.0.0.1}:${SPLIT402_PHASE7_DASHBOARD_PORT:-4027}:4027"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4027/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    volumes: *workspace-volumes

  demo-merchant:
    profiles: ["demo"]
    image: node:22-slim
    working_dir: /workspace
    command: >
      sh -lc "corepack enable &&
      corepack pnpm demo:merchant"
    depends_on:
      control-plane:
        condition: service_healthy
    env_file:
      - phase7-staging.env
    environment:
      CI: "true"
      SPLIT402_MERCHANT_ORIGIN: http://localhost:4023
      SPLIT402_MERCHANT_CONTROL_PLANE_URL: http://control-plane:4021
      PORT: "4023"
    ports:
      - "${SPLIT402_PHASE7_BIND_ADDRESS:-127.0.0.1}:${SPLIT402_PHASE7_DEMO_MERCHANT_PORT:-4023}:4023"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4023/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    volumes: *workspace-volumes

  webhook-receiver:
    profiles: ["workers"]
    image: node:22-slim
    command: >
      node -e "require('http').createServer((req,res)=>{req.resume();res.writeHead(204);res.end();}).listen(4040,'0.0.0.0')"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4040/health',{method:'POST'}).then((response)=>process.exit(response.status===204?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "${SPLIT402_PHASE7_BIND_ADDRESS:-127.0.0.1}:${SPLIT402_PHASE7_WEBHOOK_RECEIVER_PORT:-4040}:4040"

  chain-worker:
    profiles: ["workers"]
    image: node:22-slim
    working_dir: /workspace
    command: >
      sh -lc "corepack enable &&
      corepack pnpm worker:chain"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - phase7-staging.env
    environment:
      CI: "true"
      SPLIT402_DATABASE_URL: postgresql://split402:split402@postgres:5432/split402
      SPLIT402_DATABASE_SSL: "false"
    volumes: *workspace-volumes

  webhook-worker:
    profiles: ["workers"]
    image: node:22-slim
    working_dir: /workspace
    command: >
      sh -lc "corepack enable &&
      corepack pnpm worker:webhook"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - phase7-staging.env
    environment:
      CI: "true"
      SPLIT402_DATABASE_URL: postgresql://split402:split402@postgres:5432/split402
      SPLIT402_DATABASE_SSL: "false"
    volumes: *workspace-volumes

  payout-finality-worker:
    profiles: ["workers"]
    image: node:22-slim
    working_dir: /workspace
    command: >
      sh -lc "corepack enable &&
      corepack pnpm worker:payout-finality"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - phase7-staging.env
    environment:
      CI: "true"
      SPLIT402_DATABASE_URL: postgresql://split402:split402@postgres:5432/split402
      SPLIT402_DATABASE_SSL: "false"
    volumes: *workspace-volumes

volumes:
  split402-phase7-postgres:
  split402-phase7-root-node-modules:
  split402-phase7-agent-sdk-node-modules:
  split402-phase7-control-plane-node-modules:
  split402-phase7-express-node-modules:
  split402-phase7-merchant-sdk-node-modules:
  split402-phase7-protocol-node-modules:
  split402-phase7-router-node-modules:
  split402-phase7-test-vectors-node-modules:
  split402-phase7-x402-extension-node-modules:
  split402-phase7-dashboard-node-modules:
  split402-phase7-demo-agent-node-modules:
  split402-phase7-demo-merchant-node-modules:
  split402-phase7-mcp-demo-node-modules:
  split402-phase7-payout-signer-node-modules:
